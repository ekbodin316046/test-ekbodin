<nav class="sidebar" [class.closed]="!open()" aria-label="เมนูหลัก">
  <div class="profile">
    <div class="avatar" aria-hidden="true">D</div>
    <div class="profile-text">
      <span class="profile-name">demo.user</span>
      <span class="profile-role">ฝ่ายจัดซื้อ</span>
    </div>
  </div>

  <div class="menu">
    @for (section of sections; track section.title) {
      <p class="section-title">{{ section.title }}</p>

      <ul>
        @for (item of section.items; track item.route) {
          <li>
            <a [routerLink]="item.route" routerLinkActive="active">
              <span class="icon" aria-hidden="true">
                @switch (item.icon) {
                  @case ('approve') {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M3 2.5h7l3 3v8H3z" />
                      <path d="M5.5 8.5l1.8 1.8 3.2-3.6" />
                    </svg>
                  }
                  @case ('chart') {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M2.5 13.5h11" />
                      <path d="M4.5 13.5v-5M8 13.5v-9M11.5 13.5v-3" />
                    </svg>
                  }
                  @case ('settings') {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                      <circle cx="8" cy="8" r="2.2" />
                      <path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" />
                    </svg>
                  }
                }
              </span>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </div>

  <p class="version">เวอร์ชันทดสอบ · ข้อมูล mockup</p>
</nav>
